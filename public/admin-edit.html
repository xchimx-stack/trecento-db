<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trecento Manual Corrections</title><style>*{box-sizing:border-box}body{font:14px system-ui;margin:28px;max-width:900px}section{border:1px solid #ddd;border-radius:12px;padding:15px;margin:14px 0}input,select{padding:7px;width:100%;margin:4px 0 9px}button{padding:8px 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<a href="/admin.html">← Admin Hub</a><h1>Manual corrections</h1><p class="muted">No artist creation is available here. Select an existing artist. Relationship edits require two existing ULAN IDs.</p>
<label>Admin token<input id="token" type="password"></label>
<section><h2>Existing artist override</h2><select id="artist"></select><div class="grid"><label>Tier<select id="tier"><option value="">Automatic</option><option value="core">Core</option><option value="expanded">Expanded</option><option value="unmapped">Unmapped</option></select></label><label>Region<input id="region"></label><label>Active from<input id="from" type="number"></label><label>Active to<input id="to" type="number"></label></div><label>Note<input id="note"></label><button id="save">Save override</button> <span id="saveStatus"></span></section>
<section><h2>Relationship edit</h2><div class="grid"><label>From ULAN ID<input id="fromUlan" placeholder="500..."></label><label>To ULAN ID<input id="toUlan" placeholder="500..."></label></div><label>Relationship type<select id="relType"><option>direct influence</option><option>influenced by</option><option>pupil of</option><option>teacher of</option><option>master of</option><option>workshop of</option><option>collaborated with</option><option>proposed identity</option></select></label><label>Note/source rationale<input id="relNote"></label><button id="saveRel">Save relationship</button> <span id="relStatus"></span></section>
<script>
let graph;
(async()=>{graph=await (await fetch("/api/graph")).json();const s=document.getElementById("artist");for(const a of (graph.artists||[]).slice().sort((a,b)=>a.canonical_name.localeCompare(b.canonical_name))){const o=document.createElement("option");o.value=a.id;o.textContent=`${a.canonical_name}${a.ulan?.id?` · ULAN ${a.ulan.id}`:""}`;s.appendChild(o)}})();
document.getElementById("save").onclick=async()=>{const token=document.getElementById("token").value.trim();const body={artistId:document.getElementById("artist").value,tier:document.getElementById("tier").value||null,region:document.getElementById("region").value.trim()||null,activeFrom:Number(document.getElementById("from").value)||null,activeTo:Number(document.getElementById("to").value)||null,note:document.getElementById("note").value.trim()||null};const r=await fetch("/api/artists?action=override",{method:"POST",headers:{"content-type":"application/json","x-crawl-token":token},body:JSON.stringify(body)});const d=await r.json();document.getElementById("saveStatus").textContent=r.ok?"Saved":d.error||"Failed"};
document.getElementById("saveRel").onclick=async()=>{const token=document.getElementById("token").value.trim();const body={from_ulan:document.getElementById("fromUlan").value.trim(),to_ulan:document.getElementById("toUlan").value.trim(),relationship_type:document.getElementById("relType").value,note:document.getElementById("relNote").value.trim()};const r=await fetch("/api/artists?action=relationship-edit",{method:"POST",headers:{"content-type":"application/json","x-crawl-token":token},body:JSON.stringify(body)});const d=await r.json();document.getElementById("relStatus").textContent=r.ok?`Saved ${d.from} → ${d.to}`:d.error||"Failed"};
</script></body></html>
