<!doctype html><meta charset="utf-8"><title>Trecento Discovery Report</title>
<style>body{font:14px system-ui;margin:24px;max-width:1200px}button{padding:8px 12px}table{border-collapse:collapse;width:100%;margin-top:16px}th,td{border-bottom:1px solid #ccc;padding:7px;text-align:left}small{color:#666}.ok{font-weight:600}</style>
<h1>Trecento candidate discovery — report only</h1>
<p>Queries Wikidata for Italian painters/illuminators whose documented life/activity plausibly overlaps 1270–1420. Nothing is added to the database from this page.</p>
<button id="run">Build candidate report</button> <span id="status"></span>
<table><thead><tr><th>Name</th><th>Dates</th><th>Occupation</th><th>Place / region signal</th><th>Wikidata</th><th>ULAN</th><th>Wikipedia</th><th>Assessment</th></tr></thead><tbody id="rows"></tbody></table>
<script>
document.getElementById('run').onclick=async()=>{
 const s=document.getElementById('status'); s.textContent='Working…';
 try{
  const r=await fetch('/api/discover-trecento'); const d=await r.json(); if(!r.ok) throw new Error(d.error||'failed');
  document.getElementById('rows').innerHTML=(d.candidates||[]).map(x=>`<tr><td>${x.name||''}</td><td>${x.dates||''}</td><td>${x.occupation||''}</td><td>${x.place||''}</td><td>${x.wikidata?`<a target="_blank" href="${x.wikidata}">${x.qid}</a>`:''}</td><td>${x.ulan||'—'}</td><td>${x.wikipedia?`<a target="_blank" href="${x.wikipedia}">article</a>`:'—'}</td><td class="${x.assessment==='credible'?'ok':''}">${x.assessment||'review'}</td></tr>`).join('');
  s.textContent=`${d.candidates.length} candidates`;
 }catch(e){s.textContent=e.message}
};
</script>
