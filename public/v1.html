<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Network Viewer · v1.0.4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f3ed;color:#1f1f1f;font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}.topbar{position:fixed;z-index:30;top:0;left:0;right:0;min-height:46px;padding:6px 8px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;background:rgba(246,243,237,.94);border-bottom:1px solid rgba(80,70,60,.1);backdrop-filter:blur(5px)}
.brand{padding:3px 8px 0 2px;min-width:210px}.brand b{font-family:Georgia,serif;font-size:17px}.brand small{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#765f52}
.control{display:flex;border:1px solid #cfc9bf;border-radius:9px;overflow:hidden;background:#fff}.control button{border:0;background:transparent;padding:8px 11px;cursor:pointer}.control button.active{background:#556d7a;color:#fff}.dropdown{position:relative}.dropbtn{border:1px solid #cfc9bf;border-radius:9px;background:#fff;padding:8px 11px;cursor:pointer}.menu{display:none;position:absolute;z-index:50;top:38px;left:0;min-width:210px;max-height:360px;overflow:auto;background:white;border:1px solid #cbc5bc;border-radius:9px;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.12)}.dropdown.open .menu{display:block}.menu label{display:block;padding:4px}.sourcebox{margin-left:auto;border:1px solid #d6d0c7;border-radius:9px;background:rgba(255,255,255,.92);padding:6px 9px;font-size:11px}.sourcebox b{font-size:9px;letter-spacing:.08em}.sourcebox label{display:block;margin-top:4px}
#canvas{position:absolute;inset:0;touch-action:none;cursor:grab}#canvas.dragging{cursor:grabbing}.edge{fill:none;stroke:#98504d;stroke-opacity:.34}.edge.manual{stroke:#4f6577}.edge.dashed{stroke-dasharray:8 5}.edge.dotted{stroke-dasharray:2 5}.node circle{fill:#fff;stroke:#282828;stroke-width:1.5}.node text{font-size:11px;font-weight:600;text-anchor:middle;pointer-events:none}.node .year{font-size:9px;font-weight:400;fill:#5f5f5f}.node.selected circle{fill:#ead9d6;stroke:#995248;stroke-width:3}.node.dim{opacity:.16}.edge.dim{opacity:.05}
.drawer{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(430px,92vw);background:#fff;border-right:1px solid #d8d3ca;transform:translateX(-100%);transition:transform .18s ease;overflow:auto}.drawer.open{transform:none}.drawer-head{position:sticky;top:0;background:#fff;padding:14px 16px 8px;border-bottom:1px solid #eee}.drawer-head button{float:right;border:0;background:none;font-size:22px;cursor:pointer}.drawer-body{padding:12px 16px 30px}.drawer h2{font-family:Georgia,serif;font-size:23px;margin:0 32px 3px 0}.drawer h4{margin:20px 0 6px;font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:#65554b}.thumb{width:100%;max-height:360px;object-fit:contain;background:#f3f3f3;border:1px solid #ddd;border-radius:7px}.muted{color:#746f68}.pill{display:inline-block;border:1px solid #d6d0c8;border-radius:999px;padding:2px 7px;margin:2px;font-size:11px}.links a{margin-right:10px;color:#654d42}
.loading{position:fixed;z-index:100;inset:0;background:rgba(246,243,237,.78);display:grid;place-items:center}.loading.hidden{display:none}.loaderbox{text-align:center}.spinner{width:34px;height:34px;border:3px solid #cfc9c0;border-top-color:#556d7a;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 9px}@keyframes spin{to{transform:rotate(360deg)}}
.footer{position:fixed;z-index:25;right:10px;bottom:8px;color:#766f67;font-size:11px}.footer button{border:0;background:none;color:inherit;font:italic 11px Georgia,serif;cursor:pointer;text-decoration:underline}.method{position:fixed;z-index:60;right:15px;bottom:30px;width:min(520px,90vw);max-height:70vh;overflow:auto;background:#fff;border:1px solid #d1cbc2;border-radius:10px;padding:15px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:none}.method.open{display:block}.networkpicker{position:fixed;z-index:80;inset:0;background:#f6f3ed;overflow:auto;padding:35px}.networkpicker.hidden{display:none}.networkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;max-width:1000px;margin:auto}.netcard{background:#fff;border:1px solid #cbc5bc;border-radius:12px;padding:15px;cursor:pointer}.netcard:hover{border-color:#6f665c}.netcard b{font-size:17px}.countrow{display:flex;gap:15px;margin-top:10px}.countrow strong{font-size:20px}
@media(max-width:850px){.sourcebox{display:none}.brand{min-width:150px}.topbar{gap:4px}.control button,.dropbtn{padding:7px 8px}}
</style></head><body>
<div id="picker" class="networkpicker"><div style="max-width:1000px;margin:auto"><div class="muted">Generic network viewer · v1.0.4</div><h1 style="font-family:Georgia,serif">Art Networks</h1><p>Select a network generated through the common ULAN engine.</p><div id="networkGrid" class="networkgrid"></div><p><a href="/admin-v1.html">Administration</a> · <a href="/">Current production viewer</a></p></div></div>
<div class="topbar">
 <div class="brand"><b id="brandName">Art Network</b><small id="brandMeta">ULAN-driven network</small></div>
 <div class="control" id="tiers"><button data-tier="core" class="active">Core</button><button data-tier="expanded">Expanded</button><button data-tier="comprehensive">Comprehensive</button></div>
 <div class="dropdown" id="citiesDrop"><button class="dropbtn">Cities ▾</button><div class="menu" id="citiesMenu"></div></div>
 <div class="dropdown" id="rolesDrop"><button class="dropbtn">Roles ▾</button><div class="menu" id="rolesMenu"></div></div>
 <div class="sourcebox"><b>CONNECTION SOURCE</b><label><input type="checkbox" data-source="ULAN" checked> ULAN</label><label id="wikiSourceLabel"><input type="checkbox" data-source="Wikipedia" checked> Wikipedia (BETA)</label><label><input type="checkbox" data-source="Manual" checked> Manual</label></div>
</div>
<svg id="canvas"></svg>
<div id="drawer" class="drawer"><div class="drawer-head"><button id="closeDrawer">‹</button><h2 id="dName"></h2><div id="dMeta" class="muted"></div></div><div id="dBody" class="drawer-body"></div></div>
<div id="loading" class="loading"><div class="loaderbox"><div class="spinner"></div><div id="loadingText">Loading network…</div></div></div>
<div class="footer"><button id="methodBtn">methodology</button> · wheel to zoom</div>
<div id="methodBox" class="method"><b>Methodology</b><button id="methodClose" style="float:right;border:0;background:none;cursor:pointer">×</button><div id="methodText" style="white-space:pre-wrap;margin-top:10px"></div></div>
<script>
const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let network=null,data=null,tier='core',selected=null,scale=1,tx=0,ty=0,drag=null,nodePos=new Map(),cityOn=new Set(),roleOn=new Set(),sourceOn=new Set(['ULAN','Wikipedia','Manual']);
async function api(action,q={}){const u=new URL('/api/v1',location.origin);u.searchParams.set('action',action);for(const[k,v]of Object.entries(q))if(v!=null)u.searchParams.set(k,v);const r=await fetch(u);const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function showLoading(t){$('loadingText').textContent=t;$('loading').classList.remove('hidden')}function hideLoading(){$('loading').classList.add('hidden')}
async function boot(){showLoading('Loading networks…');try{const d=await api('list-networks');renderPicker(d.networks||[]);const param=new URLSearchParams(location.search).get('network');if(param){const n=(d.networks||[]).find(x=>x.id===param||x.slug===param);if(n)await openNetwork(n)}}catch(e){$('networkGrid').innerHTML=`<div>${esc(e.message)}</div>`}finally{hideLoading()}}
function renderPicker(nets){$('networkGrid').innerHTML=nets.map(n=>`<div class="netcard" data-id="${n.id}"><b>${esc(n.public_label||n.name)}</b><div class="muted">${esc(n.description||'')}</div><div class="countrow"><span><strong>${n.counts.core}</strong><br>Core</span><span><strong>${n.counts.expanded}</strong><br>Expanded</span><span><strong>${n.counts.comprehensive}</strong><br>Comprehensive</span></div></div>`).join('')||'<div>No networks yet.</div>';document.querySelectorAll('.netcard').forEach(c=>c.onclick=()=>{const n=nets.find(x=>x.id===c.dataset.id);openNetwork(n)})}
async function openNetwork(n){network=n;$('picker').classList.add('hidden');history.replaceState(null,'',`/v1.html?network=${encodeURIComponent(n.slug||n.id)}`);showLoading('Loading published network…');data=await api('graph',{network:n.id});$('brandName').textContent=n.public_label||n.name;$('brandMeta').textContent=`${n.start_year||'?'}–${n.end_year||'?'} · ${data.artists.length} artists`;$('wikiSourceLabel').style.display=n.wikipedia_relationships_enabled?'block':'none';$('methodText').textContent=n.methodology_text||defaultMethodology(n);setupFilters();layout();fitInitial();render();hideLoading()}
function defaultMethodology(n){return `${n.public_label||n.name} is generated from a curator-selected Core and Getty ULAN relationships. Expanded represents one ULAN hop from Core; Comprehensive adds a second hop. Curatorial additions and manual relationships remain separate from ULAN source data.${n.wikipedia_relationships_enabled?' Wikipedia relationship sourcing is experimental (BETA) for this network.':''}`}
function visibleTier(a){return tier==='core'?a.tier==='core':tier==='expanded'?a.tier!=='comprehensive':true}
function roleCats(a){const r=(a.roles||[]).map(x=>String(x).toLowerCase());const out=[];if(r.some(x=>x.includes('paint')))out.push('Painter');if(r.some(x=>x.includes('illumin')))out.push('Illuminator');if(r.some(x=>x.includes('print')||x.includes('engraver')||x.includes('woodcut')))out.push('Printmaker');if(!out.length)out.push('Other / unclassified');return out}
function city(a){return a.region||'Unknown'}
function setupFilters(){const cities=[...new Set(data.artists.map(city))].sort();cityOn=new Set(cities);$('citiesMenu').innerHTML=`<label><input id="allCities" type="checkbox" checked> Select all</label>`+cities.map(c=>`<label><input type="checkbox" class="citycb" value="${esc(c)}" checked> ${esc(c)}</label>`).join('');$('allCities').onchange=e=>{document.querySelectorAll('.citycb').forEach(x=>x.checked=e.target.checked);cityOn=e.target.checked?new Set(cities):new Set();render()};document.querySelectorAll('.citycb').forEach(x=>x.onchange=()=>{cityOn=new Set([...document.querySelectorAll('.citycb:checked')].map(y=>y.value));$('allCities').checked=cityOn.size===cities.length;render()});
 const roles=[...new Set(data.artists.flatMap(roleCats))].sort();roleOn=new Set(roles);$('rolesMenu').innerHTML=`<label><input id="allRoles" type="checkbox" checked> Select all</label>`+roles.map(r=>`<label><input type="checkbox" class="rolecb" value="${esc(r)}" checked> ${esc(r)}</label>`).join('');$('allRoles').onchange=e=>{document.querySelectorAll('.rolecb').forEach(x=>x.checked=e.target.checked);roleOn=e.target.checked?new Set(roles):new Set();render()};document.querySelectorAll('.rolecb').forEach(x=>x.onchange=()=>{roleOn=new Set([...document.querySelectorAll('.rolecb:checked')].map(y=>y.value));$('allRoles').checked=roleOn.size===roles.length;render()});
 document.querySelectorAll('[data-source]').forEach(x=>{x.checked=true;x.onchange=()=>{sourceOn=new Set([...document.querySelectorAll('[data-source]:checked')].map(y=>y.dataset.source));render()}})
}
function hash(s){let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function layout(){const W=1800,H=1000,artists=data.artists;const years=artists.map(a=>Number(a.layout_year)).filter(Number.isFinite),minY=Math.min(...years,network.start_year||1300),maxY=Math.max(...years,network.end_year||1700);const cities=[...new Set(artists.map(city))].sort();const cx=new Map(cities.map((c,i)=>[c,120+(i+0.5)*(W-240)/Math.max(1,cities.length)]));nodePos.clear();for(const a of artists){const yv=Number(a.layout_year),yn=Number.isFinite(yv)?(yv-minY)/Math.max(1,maxY-minY):.5;const jitter=(hash(a.ulan_id)%1000)/1000-.5;nodePos.set(a.ulan_id,{x:(cx.get(city(a))||W/2)+jitter*110,y:100+yn*(H-200)+(((hash(a.canonical_name)>>8)%1000)/1000-.5)*45,vx:0,vy:0})}
 // bounded force relaxation: relationship pull + collision avoidance, chronology/geography remain anchors.
 const by=new Map(artists.map(a=>[a.ulan_id,a]));for(let k=0;k<110;k++){for(const r of data.relationships){const p=nodePos.get(r.from_ulan),q=nodePos.get(r.to_ulan);if(!p||!q)continue;let dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1,ideal=r.family==='training'?115:145,force=(d-ideal)*.002;p.vx+=dx/d*force;p.vy+=dy/d*force;q.vx-=dx/d*force;q.vy-=dy/d*force}const vals=[...nodePos.values()];for(let i=0;i<vals.length;i++)for(let j=i+1;j<vals.length;j++){let p=vals[i],q=vals[j],dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;if(d2<3600){let d=Math.sqrt(d2)||1,f=(60-d)*.015;p.vx-=dx/d*f;p.vy-=dy/d*f;q.vx+=dx/d*f;q.vy+=dy/d*f}}for(const a of artists){const p=nodePos.get(a.ulan_id),anchorX=cx.get(city(a))||W/2;const yv=Number(a.layout_year),yn=Number.isFinite(yv)?(yv-minY)/Math.max(1,maxY-minY):.5,anchorY=100+yn*(H-200);p.vx+=(anchorX-p.x)*.002;p.vy+=(anchorY-p.y)*.004;p.vx*=.72;p.vy*=.72;p.x+=p.vx;p.y+=p.vy}}
}
function nodeVisible(a){return visibleTier(a)&&cityOn.has(city(a))&&roleCats(a).some(r=>roleOn.has(r))}
function render(){const svg=$('canvas');while(svg.firstChild)svg.removeChild(svg.firstChild);const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);svg.appendChild(g);const visible=new Set(data.artists.filter(nodeVisible).map(a=>a.ulan_id));
 const defs=document.createElementNS(NS,'defs');defs.innerHTML='<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#98504d"/></marker>';g.appendChild(defs);
 for(const r of data.relationships){if(!sourceOn.has(r.source)||!visible.has(r.from_ulan)||!visible.has(r.to_ulan))continue;const p=nodePos.get(r.from_ulan),q=nodePos.get(r.to_ulan);if(!p||!q)continue;const line=document.createElementNS(NS,'line');line.setAttribute('x1',p.x);line.setAttribute('y1',p.y);line.setAttribute('x2',q.x);line.setAttribute('y2',q.y);line.setAttribute('class',`edge ${r.source==='Manual'?'manual ':''}${r.visual_class||'dotted'}`);line.setAttribute('stroke-width',r.visual_class==='solid'?1.8:1.15);if(r.directed)line.setAttribute('marker-end','url(#arrow)');g.appendChild(line)}
 for(const a of data.artists){if(!visible.has(a.ulan_id))continue;const p=nodePos.get(a.ulan_id),deg=data.relationships.filter(r=>r.from_ulan===a.ulan_id||r.to_ulan===a.ulan_id).length,r=Math.min(38,18+Math.sqrt(deg)*4);const ng=document.createElementNS(NS,'g');ng.setAttribute('class','node'+(selected===a.ulan_id?' selected':''));ng.setAttribute('transform',`translate(${p.x} ${p.y})`);ng.dataset.ulan=a.ulan_id;const c=document.createElementNS(NS,'circle');c.setAttribute('r',r);ng.appendChild(c);const t=document.createElementNS(NS,'text');t.setAttribute('y','-2');t.textContent=a.canonical_name.toUpperCase();ng.appendChild(t);const y=document.createElementNS(NS,'text');y.setAttribute('class','year');y.setAttribute('y','13');y.textContent=a.layout_year?`c. ${a.layout_year}`:'';ng.appendChild(y);ng.addEventListener('click',e=>{e.stopPropagation();selectArtist(a)});g.appendChild(ng)}
}
function selectArtist(a){selected=a.ulan_id;render();$('drawer').classList.add('open');$('dName').textContent=a.canonical_name;$('dMeta').textContent=`${a.region||'Unknown location'} · ${a.layout_year?`layout c. ${a.layout_year}`:'date unresolved'} · ${a.tier}`;const rels=data.relationships.filter(r=>(r.from_ulan===a.ulan_id||r.to_ulan===a.ulan_id)&&sourceOn.has(r.source));const by=new Map(data.artists.map(x=>[x.ulan_id,x]));const thumb=a.thumbnail_source_url||null;let html=thumb?`<img class="thumb" src="${esc(thumb)}" alt="">`:'';html+=`<h4>Authority record</h4><div><b>Getty ULAN</b> ${esc(a.ulan_id||'—')}</div>${a.roles?.length?`<div><b>Roles:</b> ${a.roles.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:''}<div><b>Activity:</b> ${esc(a.period_start||'?')}${a.period_end&&a.period_end!==a.period_start?`–${esc(a.period_end)}`:''}</div>${a.active_places?.length?`<div><b>Active place(s):</b> ${esc(a.active_places.join(', '))}</div>`:''}${a.birth_place?`<div><b>Birth place:</b> ${esc(a.birth_place)}</div>`:''}${a.death_place?`<div><b>Death place:</b> ${esc(a.death_place)}</div>`:''}<div class="links" style="margin-top:8px">${a.wikipedia_url?`<a href="${esc(a.wikipedia_url)}" target="_blank">Wikipedia ↗</a>`:''}${a.wikidata_id?`<a href="https://www.wikidata.org/wiki/${esc(a.wikidata_id)}" target="_blank">Wikidata ↗</a>`:''}</div>`;
 html+=`<h4>Connections</h4>`+(rels.length?rels.map(r=>{const other=by.get(r.from_ulan===a.ulan_id?r.to_ulan:r.from_ulan);const arrow=r.directed?(r.from_ulan===a.ulan_id?'→':'←'):'—';return `<div style="padding:7px 0;border-bottom:1px solid #eee"><b>${arrow} ${esc(other?.canonical_name||'Unknown')}</b><div class="muted">${esc(r.family)} · ${esc(r.source)}${r.qualifiers?.length?` · ${esc(r.qualifiers.join(', '))}`:''}</div></div>`}).join(''):'<div class="muted">No visible relationships under current source filters.</div>');
 $('dBody').innerHTML=html}
function fitInitial(){const vis=data.artists.filter(a=>a.tier==='core'),pts=vis.map(a=>nodePos.get(a.ulan_id)).filter(Boolean);if(!pts.length)return;const minx=Math.min(...pts.map(p=>p.x)),maxx=Math.max(...pts.map(p=>p.x)),miny=Math.min(...pts.map(p=>p.y)),maxy=Math.max(...pts.map(p=>p.y));const w=innerWidth,h=innerHeight-50;scale=Math.min(1.1,Math.max(.45,Math.min((w-120)/Math.max(300,maxx-minx),(h-120)/Math.max(300,maxy-miny))));tx=w/2-(minx+maxx)/2*scale;ty=(h+50)/2-(miny+maxy)/2*scale}
document.querySelectorAll('#tiers button').forEach(b=>b.onclick=()=>{tier=b.dataset.tier;document.querySelectorAll('#tiers button').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('.dropbtn').forEach(b=>b.onclick=e=>{e.stopPropagation();b.parentElement.classList.toggle('open')});document.addEventListener('click',()=>document.querySelectorAll('.dropdown').forEach(x=>x.classList.remove('open')));
$('closeDrawer').onclick=()=>{$('drawer').classList.remove('open');selected=null;render()};$('methodBtn').onclick=()=>$('methodBox').classList.toggle('open');$('methodClose').onclick=()=>$('methodBox').classList.remove('open');
const svg=$('canvas');svg.addEventListener('wheel',e=>{e.preventDefault();const rect=svg.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,old=scale,f=Math.exp(-e.deltaY*.001);scale=Math.max(.2,Math.min(3.5,scale*f));tx=mx-(mx-tx)*(scale/old);ty=my-(my-ty)*(scale/old);render()},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;tx=drag.tx+dx;ty=drag.ty+dy;render()});svg.addEventListener('pointerup',e=>{drag=null;svg.classList.remove('dragging')});
boot();
</script></body></html>
