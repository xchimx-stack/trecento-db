<style>

</style></head><body>
<header>
<b>Dutch & Flemish Golden Age — hidden research view</b>
<input id="token" type="password" placeholder="Admin/crawl token">
<button id="load">Load / refresh</button><button id="fit">Fit</button><button id="pause">Pause motion</button>
<span class="muted">Show:</span><button id="tier0" class="active">Core</button><button id="tier1" class="active">Tier 2 · +1°</button><button id="tier2" class="active">Tier 3 · +2°</button>
<span id="status" class="muted">No data loaded.</span>
</header>
<div id="wrap">
<svg id="svg" viewBox="0 0 4700 3100" aria-label="Low Countries network"></svg>
<div id="legend">Horizontal = geographic center<br>Vertical = chronology<br><br>● black Core · ● gray +1° · ● light +2°<br>ULAN relationships only</div>
<aside id="drawer"><button id="drawerClose">×</button><h2 id="dName"></h2><div id="dTier" class="muted"></div><div id="thumb">Select an artist</div><div id="wikiDiag" class="diag"></div>
<div class="section"><h3>Activity</h3><div id="dActivity"></div></div>

</aside>
</div>
<script>
const svg=document.getElementById("svg"),NS="http://www.w3.org/2000/svg",W=4700,H=3100;
const $=id=>document.getElementById(id);let nodes=[],edges=[],running=false,raf=null,view={x:0,y:0,w:W,h:H},selected=null,visible=new Set([0,1,2]),mediaAbort=null;
const GEO_ORDER=[
 "Flanders","Antwerp","Brussels","Ghent","Bruges","Mechelen","Zeeland",
 "Dordrecht","Rotterdam","The Hague","Delft","Leiden","Haarlem","Amsterdam",
 "Utrecht","Deventer","Holland","Unknown"
];
let GEO=[],GX=new Map(),GWIDTH=new Map(),CURRENT_W=W;
function buildGeographyBands(){
 const counts=new Map(GEO_ORDER.map(x=>[x,0]));
 for(const n of nodes){const g=nearestGeo(n.geo);counts.set(g,(counts.get(g)||0)+1)}
 let cursor=180;GEO=[];GX=new Map();GWIDTH=new Map();
 for(const name of GEO_ORDER){
   const count=counts.get(name)||0;
   // Width scales with population rather than giving every city the same space.
   // sqrt keeps large hubs from exploding linearly, while Antwerp/Amsterdam
   // still receive much more room than sparse cities.
   const width=Math.round(Math.max(190,Math.min(980,170+Math.sqrt(Math.max(1,count))*105)));
   const center=cursor+width/2;
   GEO.push([name,center]);GX.set(name,center);GWIDTH.set(name,width);
   cursor+=width+38;
 }
 CURRENT_W=Math.max(W,cursor+180);
 svg.setAttribute("viewBox",`0 0 ${CURRENT_W} ${H}`);
}
const YEAR_MIN=1550,YEAR_MAX=1750,Y_TOP=230,Y_BOTTOM=2870;
function make(tag,a={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function midYear(n){if(n.birth&&n.death)return (n.birth+n.death)/2;if(n.birth)return n.birth+35;if(n.death)return n.death-45;return null}
function yearY(y){y=Math.max(YEAR_MIN,Math.min(YEAR_MAX,y||1650));return Y_TOP+(y-YEAR_MIN)/(YEAR_MAX-YEAR_MIN)*(Y_BOTTOM-Y_TOP)}
function wrapName(s,max=3){const ws=String(s||"").split(/\s+/).filter(Boolean),lines=[];let line="";for(const w of ws){const t=(line+" "+w).trim();if(line&&t.length>13&&lines.length<max-1){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines.slice(0,max)}
function radius(n){const l=n.label.length,b=n.tier===0?39:n.tier===1?34:29;return Math.min(n.tier===0?57:n.tier===1?49:42,b+Math.max(0,l-12)*.58)}
function nearestGeo(name){return GEO_ORDER.includes(name)?name:(name==="Flemish"?"Flanders":"Unknown")}
function addGuides(){
 const g=make("g");svg.appendChild(g);
 for(const [name,x] of GEO.filter(x=>x[0]!=="Unknown"&&x[0]!=="Holland"&&x[0]!=="Flanders")){
   const line=make("line",{x1:x,y1:120,x2:x,y2:H-120,class:"guide"}),t=make("text",{x,y:105,class:"geo-label"});t.textContent=name;g.append(line,t);
 }
 for(let y=1575;y<=1725;y+=25){const py=yearY(y),l=make("line",{x1:110,y1:py,x2:CURRENT_W-110,y2:py,class:"guide"}),t=make("text",{x:118,y:py-5,class:"year-label"});t.textContent=y;g.append(l,t)}
}
function inferMissing(){
 const by=new Map(nodes.map(n=>[n.id,n]));
 for(let pass=0;pass<4;pass++){
  for(const n of nodes){
   const nei=edges.filter(e=>e.a===n||e.b===n).map(e=>e.a===n?e.b:e.a);
   if((!n.geo||n.geo==="Unknown")&&nei.length){const gs=nei.map(x=>x.geo).filter(x=>x&&x!=="Unknown");if(gs.length)n.geo=gs.sort((a,b)=>gs.filter(x=>x===b).length-gs.filter(x=>x===a).length)[0]}
   if(!n.year&&nei.length){const ys=nei.map(x=>x.year).filter(Number.isFinite);if(ys.length)n.year=ys.reduce((a,b)=>a+b,0)/ys.length}
  }
 }
}
function positionNodes(){
 const buckets=new Map();
 for(const n of nodes){n.geo=nearestGeo(n.geo);n.year=midYear(n)||n.year||null}
 inferMissing();
 for(const n of nodes){n.geo=nearestGeo(n.geo)}
 buildGeographyBands();
 for(const n of nodes){
   const key=n.geo||"Unknown";if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(n)
 }
 for(const [geo,arr] of buckets){
   arr.sort((a,b)=>(a.year||1650)-(b.year||1650)||a.label.localeCompare(b.label));
   const center=GX.get(geo)||GX.get("Unknown"),width=GWIDTH.get(geo)||220;
   // Dense city bands spread nodes across more columns automatically.
   const cols=Math.max(2,Math.ceil(Math.sqrt(arr.length*1.45)));
   const usable=Math.max(100,width-100);
   arr.forEach((n,i)=>{
     const col=i%cols,row=Math.floor(i/cols);
     const xoff=cols===1?0:(col/(cols-1)-.5)*usable;
     const yoff=((row%5)-2)*34 + (Math.floor(row/5)%2?17:-17);
     n.anchorX=center+xoff;
     n.anchorY=yearY(n.year||1650)+yoff;
     n.x=n.anchorX+(Math.random()-.5)*75;n.y=n.anchorY+(Math.random()-.5)*55;
     n.vx=0;n.vy=0;n.r=radius(n);n.focusDX=0;n.focusDY=0;n.focusScale=1;
   })
 }
}
async function load(){
 const token=$("token").value.trim();if(!token){$("status").textContent="Token required.";return}
 const r=await fetch("/api/authorities?action=low-countries&mode=status",{headers:{"x-crawl-token":token}}),d=await r.json();if(!r.ok){$("status").textContent=d.error||"Load failed";return}
 const map=new Map();
 for(const s of d.seeds||[]){if(!s.ulan_id)continue;map.set(s.ulan_id,{id:s.ulan_id,label:s.preferred_name||s.seed_name,tier:0,status:s.status,geo:s.geography_bucket||"Unknown",birth:s.birth_year,death:s.death_year,year:null,score:0,seedLinks:0,strongest:null,nationality:null,role:null})}
 for(const c of d.candidates||[]){if(map.has(c.ulan_id))continue;map.set(c.ulan_id,{id:c.ulan_id,label:c.preferred_name||c.discovered_label||c.ulan_id,tier:Number(c.crawl_depth)===2?2:1,status:c.review_status,geo:c.geography_bucket||"Unknown",birth:c.birth_year,death:c.death_year,year:null,score:c.relationship_score||0,seedLinks:c.seed_connection_count||0,strongest:c.strongest_relationship||null,nationality:c.nationality_text||null,role:c.role_text||null})}
 nodes=[...map.values()];
 edges=(d.edges||[]).map(e=>({...e,a:map.get(e.from_ulan_id),b:map.get(e.to_ulan_id)})).filter(e=>e.a&&e.b);
 positionNodes();draw();start();setTimeout(fit,250);$("status").textContent=`${nodes.length} nodes · ${edges.length} ULAN relationships`;
}
function draw(){
 svg.innerHTML="";addGuides();const eg=make("g"),ng=make("g");svg.append(eg,ng);
 for(const e of edges){const l=make("line",{class:`edge ${e.visual_class||""}`});eg.appendChild(l);e.el=l}
 for(const n of nodes){
   const cls=n.tier===0?"core":n.tier===1?"degree1":"degree2",g=make("g",{class:`node ${cls}`});g.appendChild(make("circle",{r:n.r}));
   const text=make("text"),lines=wrapName(n.label,n.tier===2?2:3),lh=n.tier===2?9:10;
   lines.forEach((line,j)=>{const t=make("tspan",{x:0,y:(j-(lines.length-1)/2)*lh+3});t.textContent=line;text.appendChild(t)});g.appendChild(text);ng.appendChild(g);n.el=g;
   g.addEventListener("click",e=>{e.stopPropagation();selectNode(n)})
 }render()
}
function render(){
 for(const e of edges){
  const show=visible.has(e.a.tier)&&visible.has(e.b.tier);e.el.style.display=show?"":"none";
  if(show){e.el.setAttribute("x1",e.a.x);e.el.setAttribute("y1",e.a.y);e.el.setAttribute("x2",e.b.x);e.el.setAttribute("y2",e.b.y)}
 }
 for(const n of nodes){
  n.el.style.display=visible.has(n.tier)?"":"none";
  const scale=n===selected?1.10:1;
  n.el.setAttribute("transform",`translate(${n.x} ${n.y}) scale(${scale})`)
 }
}
function step(){
 if(!running)return;
 for(const n of nodes){
   const ax=n.anchorX+(n.focusDX||0),ay=n.anchorY+(n.focusDY||0);
   n.vx+=(ax-n.x)*.0022;n.vy+=(ay-n.y)*.0028
 }
 for(const e of edges){
  const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.max(1,Math.hypot(dx,dy)),target=330+(e.a.r+e.b.r),k=.00012*(d-target),ux=dx/d,uy=dy/d;
  e.a.vx+=ux*k;e.a.vy+=uy*k;e.b.vx-=ux*k;e.b.vy-=uy*k
 }
 // Collision is stronger than edge attraction; geography wins.
 for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  const a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),min=a.r+b.r+78;
  if(d>=min)continue;const f=.13*(min-d)/min,ux=dx/d,uy=dy/d;a.vx-=ux*f;a.vy-=uy*f;b.vx+=ux*f;b.vy+=uy*f
 }
 for(const n of nodes){n.vx*=.84;n.vy*=.84;n.x+=n.vx;n.y+=n.vy}
 render();raf=requestAnimationFrame(step)
}
function start(){if(raf)cancelAnimationFrame(raf);running=true;$("pause").textContent="Pause motion";raf=requestAnimationFrame(step)}
function fit(){const ns=nodes.filter(n=>visible.has(n.tier));if(!ns.length)return;const pad=180,minx=Math.min(...ns.map(n=>n.x-n.r))-pad,maxx=Math.max(...ns.map(n=>n.x+n.r))+pad,miny=Math.min(...ns.map(n=>n.y-n.r))-pad,maxy=Math.max(...ns.map(n=>n.y+n.r))+pad;view={x:minx,y:miny,w:Math.max(600,maxx-minx),h:Math.max(450,maxy-miny)};svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`)}
function toggle(t,id){visible.has(t)?visible.delete(t):visible.add(t);$(id).classList.toggle("active",visible.has(t));render();fit()}
function normalizeWikiName(s){
  return String(s||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g," ")
    .trim();
}

function wikiNameScore(title,target){
  const t=normalizeWikiName(title);
  const q=normalizeWikiName(target);
  if(!t||!q) return 0;
  if(t===q) return 80;
  if(t.includes(q)||q.includes(t)) return 62;

  const ta=new Set(t.split(" "));
  const qa=new Set(q.split(" "));
  const overlap=[...qa].filter(x=>ta.has(x)).length;
  const ratio=overlap/Math.max(qa.size,ta.size,1);
  return Math.round(ratio*55);
}

function artistContextScore(text){
  const s=normalizeWikiName(text);
  return /\b(painter|artist|pittore|artista|fresco|frescante|illuminator|miniatore|sculptor|scultore|architect|architetto)\b/.test(s)
    ? 15 : 0;
}


function usableArtworkFilename(title){
  const t=String(title||"").toLowerCase();
  if(!/\.(jpg|jpeg|png|webp|tif|tiff)$/i.test(t)) return false;
  return !/(logo|icon|commons-logo|wikimedia|signature|coat of arms|map|locator|flag|diagram|seal|stamp)/i.test(t);
}

async function imageHasMeaningfulColor(url,signal){
  try{
    const r=await fetch(url,{signal,mode:"cors"});
    if(!r.ok) return false;
    const blob=await r.blob();
    const bitmap=await createImageBitmap(blob);

    const maxDim=96;
    const scale=Math.min(1,maxDim/Math.max(bitmap.width,bitmap.height));
    const w=Math.max(1,Math.round(bitmap.width*scale));
    const h=Math.max(1,Math.round(bitmap.height*scale));

    const canvas=document.createElement("canvas");
    canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(bitmap,0,0,w,h);
    bitmap.close?.();

    const data=ctx.getImageData(0,0,w,h).data;
    let colorful=0, sampled=0;

    // Sample every fourth pixel. Require both saturation and a little brightness,
    // so sepia/grey engravings do not count as "color".
    for(let i=0;i<data.length;i+=16){
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a<180) continue;
      const max=Math.max(r,g,b),min=Math.min(r,g,b);
      const saturation=max===0?0:(max-min)/max;
      const brightness=max/255;
      sampled++;
      if(saturation>0.20 && brightness>0.18) colorful++;
    }

    return sampled>0 && colorful/sampled>=0.08;
  }catch(e){
    if(e?.name==="AbortError") throw e;
    return false;
  }
}

function artistFilenameAffinity(fileTitle,pageTitle){
  const file=normalizeWikiName(fileTitle);
  const page=normalizeWikiName(pageTitle);

  const stop=new Set(["di","da","del","della","de","the","of","master","maestro"]);
  const tokens=page.split(" ").filter(t=>t.length>=4 && !stop.has(t));

  if(!tokens.length) return 0;
  const hits=tokens.filter(t=>file.includes(t)).length;

  if(hits===tokens.length) return 100;
  if(hits>=2) return 80;
  if(hits===1) return 55;
  return 0;
}

async function selectRepresentativeArtwork(language,pageTitle,leadImage,signal){
  // Rule 1: Wikipedia's lead image is presumed contextually correct.
  // If it is already a color image, do not override it.
  if(leadImage){
    const leadIsColor=await imageHasMeaningfulColor(leadImage,signal);
    if(leadIsColor) return leadImage;
  }

  // Rule 2: Only hunt for alternatives when the lead is monochrome/missing.
  const api=`https://${language}.wikipedia.org/w/api.php`;

  try{
    const params=new URLSearchParams({
      action:"query",
      titles:pageTitle,
      generator:"images",
      gimlimit:"16",
      prop:"imageinfo",
      iiprop:"url",
      iiurlwidth:"900",
      format:"json",
      origin:"*"
    });

    const r=await fetch(`${api}?${params.toString()}`,{
      signal,
      mode:"cors",
      headers:{"Accept":"application/json"}
    });

    if(r.ok){
      const data=await r.json();

      const candidates=Object.values(data.query?.pages||{})
        .filter(p=>usableArtworkFilename(p.title))
        .map(p=>({
          title:p.title,
          url:p.imageinfo?.[0]?.thumburl || p.imageinfo?.[0]?.url || null,
          affinity:artistFilenameAffinity(p.title,pageTitle),
          pageid:Number(p.pageid)||0
        }))
        .filter(p=>p.url)
        .sort((a,b)=>{
          // Artist-name filename affinity first; stable-ish pageid second.
          if(b.affinity!==a.affinity) return b.affinity-a.affinity;
          return a.pageid-b.pageid;
        });

      // Strongly associated files first.
      for(const c of candidates.filter(x=>x.affinity>=55).slice(0,8)){
        if(await imageHasMeaningfulColor(c.url,signal)) return c.url;
      }

      // Then a small bounded fallback set of other article images.
      for(const c of candidates.filter(x=>x.affinity<55).slice(0,5)){
        if(await imageHasMeaningfulColor(c.url,signal)) return c.url;
      }
    }
  }catch(e){
    if(e?.name==="AbortError") throw e;
  }

  // Rule 3: Context beats color. If alternatives are uncertain/unavailable,
  // use Wikipedia's original lead image, even when monochrome.
  return leadImage||null;
}


async function wikidataIds(qid,signal){
 const p=new URLSearchParams({action:"wbgetentities",ids:qid,props:"claims",format:"json",origin:"*"}),r=await fetch(`https://www.wikidata.org/w/api.php?${p}`,{signal});if(!r.ok)throw new Error("Wikidata request failed");
 const e=(await r.json()).entities?.[qid],vals=k=>(e?.claims?.[k]||[]).map(c=>c?.mainsnak?.datavalue?.value).filter(v=>typeof v==="string");return {ulan:vals("P245"),viaf:vals("P214")}
}
async function mediaFor(n){
 if(mediaAbort)mediaAbort.abort();mediaAbort=new AbortController();const signal=mediaAbort.signal,thumb=$("thumb"),diag=$("wikiDiag");thumb.textContent="Loading image…";diag.textContent="";
 try{
  const p=new URLSearchParams({action:"query",generator:"search",gsrsearch:n.label,gsrnamespace:"0",gsrlimit:"6",prop:"info|extracts|pageimages|pageprops",inprop:"url",exintro:"1",explaintext:"1",exsentences:"3",piprop:"thumbnail",pithumbsize:"900",redirects:"1",format:"json",origin:"*"});
  const r=await fetch(`https://en.wikipedia.org/w/api.php?${p}`,{signal}),d=await r.json(),pages=Object.values(d.query?.pages||{});
  let match=null,viaf=null;
  for(const page of pages){
    const q=page.pageprops?.wikibase_item;if(!q)continue;const ids=await wikidataIds(q,signal);if(ids.ulan.includes(n.id)){match=page;viaf=ids.viaf[0]||null;break}
  }
  if(selected!==n)return;
  n.wikipedia=match?.fullurl||null;n.viaf=viaf||n.viaf||null;n.extract=match?.extract||null;
  if(match){
    const artwork=await selectRepresentativeArtwork("en",match.title,match.thumbnail?.source||null,signal);
    if(selected!==n)return;
    if(artwork){thumb.innerHTML=`<img src="${esc(artwork)}" alt="">`;diag.textContent=artwork===match.thumbnail?.source?"Verified color lead image.":"Representative color artwork selected from the verified Wikipedia article."}
    else{thumb.textContent="No verified artwork";diag.textContent="Verified Wikipedia page found, but no suitable artwork image was available."}
  }else{thumb.textContent="No verified thumbnail";diag.textContent="No ULAN-verified Wikipedia match found."}
  fillAuthorities(n);fillActivity(n)
 }catch(e){if(e.name==="AbortError")return;thumb.textContent="Image unavailable";diag.textContent="Media lookup failed."}
}
function fillActivity(n){const bits=[];if(n.birth||n.death)bits.push(`${n.birth||"?"}–${n.death||"?"}`);if(n.geo&&n.geo!=="Unknown")bits.push(n.geo);if(n.nationality)bits.push(n.nationality);if(n.role)bits.push(n.role);if(n.extract)bits.push(n.extract);$("dActivity").innerHTML=bits.length?bits.map(x=>`<div class="row">${esc(x)}</div>`).join(""):'<div class="row muted">Activity metadata not yet enriched.</div>'}
function fillAuthorities(n){let html=`<a target="_blank" rel="noreferrer" href="https://www.getty.edu/vow/ULANFullDisplay?find=&nation=&role=&subjectid=${n.id}">Getty ULAN ${n.id} ↗</a>`;if(n.viaf)html+=`<a target="_blank" rel="noreferrer" href="https://viaf.org/viaf/${esc(n.viaf)}">VIAF ${esc(n.viaf)} ↗</a>`;if(n.wikipedia)html+=`<a target="_blank" rel="noreferrer" href="${esc(n.wikipedia)}">Wikipedia ↗</a>`;$("dAuthorities").innerHTML=html}
function animateTo(n,d=300){const target={x:n.x-view.w*.5,y:n.y-view.h*.45},from={x:view.x,y:view.y},st=performance.now();function f(now){const t=Math.min(1,(now-st)/d),e=1-Math.pow(1-t,3);view.x=from.x+(target.x-from.x)*e;view.y=from.y+(target.y-from.y)*e;svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);if(t<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function clearFocus(){
 for(const n of nodes){n.focusDX=0;n.focusDY=0;n.el?.classList.remove("focus-related","focus-dim")}
 for(const e of edges)e.el?.classList.remove("focus-related","focus-dim")
}
function applyFocus(n){
 clearFocus();
 const incident=edges.filter(e=>e.a===n||e.b===n);
 const related=new Set([n]);
 for(const e of incident)related.add(e.a===n?e.b:e.a);
 for(const node of nodes){
   if(related.has(node))node.el?.classList.add("focus-related");
   else node.el?.classList.add("focus-dim");
 }
 for(const e of edges){
   if(e.a===n||e.b===n)e.el?.classList.add("focus-related");
   else e.el?.classList.add("focus-dim");
 }
 // Tiny local "breath": push immediate neighbors away from the selected node.
 const neighbors=[...related].filter(x=>x!==n);
 for(const other of neighbors){
   let dx=other.x-n.x,dy=other.y-n.y,d=Math.max(1,Math.hypot(dx,dy));
   other.focusDX=(dx/d)*46;other.focusDY=(dy/d)*46;
 }
}
function selectNode(n){
 if(selected?.el)selected.el.classList.remove("selected");selected=n;n.el.classList.add("selected");applyFocus(n);$("dName").textContent=n.label;$("dTier").textContent=n.tier===0?"Core seed":n.tier===1?"Tier 2 · one ULAN degree":"Tier 3 · two ULAN degrees";fillActivity(n);fillAuthorities(n);
 const inc=edges.filter(e=>e.a===n||e.b===n).map(e=>({e,other:e.a===n?e.b:e.a})).sort((a,b)=>a.other.label.localeCompare(b.other.label));
 $("dConnections").innerHTML=inc.length?"":'<div class="row muted">No staged connections.</div>';
 for(const x of inc){const b=document.createElement("button");b.className="conn";b.innerHTML=`<b>${esc(x.other.label)}</b><br><span class="muted">${esc(x.e.relationship_type||"relationship")}</span>`;b.onclick=()=>{selectNode(x.other);animateTo(x.other)};$("dConnections").appendChild(b)}
 $("drawer").classList.add("open");mediaFor(n)
}
$("load").onclick=load;$("fit").onclick=fit;$("pause").onclick=()=>{running=!running;$("pause").textContent=running?"Pause motion":"Resume motion";if(running)raf=requestAnimationFrame(step)};
$("tier0").onclick=()=>toggle(0,"tier0");$("tier1").onclick=()=>toggle(1,"tier1");$("tier2").onclick=()=>toggle(2,"tier2");
$("drawerClose").onclick=e=>{e.stopPropagation();$("drawer").classList.remove("open")};svg.onclick=()=>{if(selected?.el)selected.el.classList.remove("selected");selected=null;clearFocus();$("drawer").classList.remove("open")};
let pan=null;svg.onpointerdown=e=>{if(e.target.closest?.(".node"))return;pan={x:e.clientX,y:e.clientY,v:{...view}};svg.classList.add("dragging");svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!pan)return;const r=svg.getBoundingClientRect(),dx=(e.clientX-pan.x)*pan.v.w/r.width,dy=(e.clientY-pan.y)*pan.v.h/r.height;view={...pan.v,x:pan.v.x-dx,y:pan.v.y-dy};svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`)};svg.onpointerup=()=>{pan=null;svg.classList.remove("dragging")};
svg.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY>0?1.12:.89;view.w*=f;view.h*=f;svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`)},{passive:false});
</script></body></html>
